<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEOVA // Главная</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <div class="header-left">
            <button class="menu-btn" id="menuToggle">☰</button>
            <a href="index.html" class="cyber-logo-link">
                <div class="cyber-logo-container" id="logoSticker" title="Кликни меня!">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </div>
                <span class="cyber-logo-text">NEOVA</span>
            </a>
        </div>
        
        <div class="search-bar">
            <span>🔍</span>
            <input type="text" placeholder="Поиск по экосистеме...">
        </div>

        <div class="user-nav">
            <a href="catalog.html">🛒</a>
            <a href="#">👤</a>
        </div>
    </header>

    <!-- Выдвижное боковое меню -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo">НАВИГАЦИЯ</span>
            <button class="close-btn" id="sidebarClose">&times;</button>
        </div>
        <div class="sidebar-nav">
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог товаров</a>
            <a href="#">Кибер-устройства</a>
            <a href="#">Контакты</a>
        </div>
    </div>
    <div class="overlay" id="overlay"></div>

    <!-- Главный интерактивный баннер -->
    <div class="hero-display-container">
        <div class="monitor-container" id="canvas-container"></div>
    </div>

    <h2 class="section-title">Популярные категории</h2>

    <footer>
        <p>&copy; 2026 NEOVA Cybernetics. Все права защищены.</p>
    </footer>

    <!-- Подключаем Three.js для 3D-сцены -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Логика мобильного меню
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarClose = document.getElementById('sidebarClose');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        menuToggle.addEventListener('click', toggleMenu);
        sidebarClose.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // Интерактивный логотип-стикер (глюк и смена состояний)
        const sticker = document.getElementById('logoSticker');
        sticker.addEventListener('click', () => {
            sticker.classList.add('glitch-active');
            setTimeout(() => sticker.classList.remove('glitch-active'), 250);
        });

        // 3D Сцена с монитором
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const geometry = new THREE.BoxGeometry(4, 2.4, 0.2);
        const material = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
        const monitor = new THREE.Mesh(geometry, material);
        scene.add(monitor);

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            monitor.rotation.y += 0.005;
            monitor.rotation.x = Math.sin(Date.now() * 0.001) * 0.1;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
